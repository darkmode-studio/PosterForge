name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          PF_KEYSTORE_B64: ${{ secrets.PF_KEYSTORE_B64 }}
        run: |
          echo "$PF_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PF_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build signed release APK
        env:
          PF_KEYSTORE_PASSWORD: ${{ secrets.PF_KEYSTORE_PASSWORD }}
          PF_KEY_ALIAS: ${{ secrets.PF_KEY_ALIAS }}
          PF_KEY_PASSWORD: ${{ secrets.PF_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/*.apk | grep SHA-256
      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: PosterForge-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
